services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
      POSTGRES_DB: inbox
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build:
      context: .
      args:
        PROJECT: WebhookInbox.Api
    environment:
      ConnectionStrings__Inbox: Host=db;Username=inbox;Password=inbox;Database=inbox
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        PROJECT: WebhookInbox.Worker
    environment:
      ConnectionStrings__Inbox: Host=db;Username=inbox;Password=inbox;Database=inbox
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
