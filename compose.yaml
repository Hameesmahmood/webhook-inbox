services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
      POSTGRES_DB: inbox
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build:
      context: .
      args:
        PROJECT_DIR: src/WebhookInbox.Api
        APP: WebhookInbox.Api
    environment:
      ConnectionStrings__Inbox: Host=db;Username=inbox;Password=inbox;Database=inbox
      ASPNETCORE_URLS: http://+:8080
      Inbox__AdminKey: ${INBOX_ADMIN_KEY:-local-admin-key}
      # One example source. Add your own the same way: Inbox__Sources__<name>__...
      Inbox__Sources__demo__IdempotencyHeader: X-Event-Id
      Inbox__Sources__demo__Destinations__0: http://sink:8080/hooks
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # So `docker compose up --wait` returns only once the API answers. The image has no curl, so plain bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200' <&3"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    build:
      context: .
      args:
        PROJECT_DIR: src/WebhookInbox.Worker
        APP: WebhookInbox.Worker
    environment:
      ConnectionStrings__Inbox: Host=db;Username=inbox;Password=inbox;Database=inbox
    depends_on:
      db:
        condition: service_healthy

  # A demo consumer that records what it receives. Replace it with your own app.
  sink:
    build:
      context: .
      args:
        PROJECT_DIR: tools/WebhookInbox.Sink
        APP: WebhookInbox.Sink
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"

volumes:
  db:
