name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait --wait-timeout 180 db
      - run: docker compose up --build --detach
      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: The worker and demo consumer are running
        run: |
          running="$(docker compose ps --status running --services)"
          echo "$running" | grep -qx worker
          echo "$running" | grep -qx sink
      - if: always()
        run: docker compose down --volumes

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Send 2,000 events while killing workers
        run: ./scripts/chaos.sh 2000 chaos-results.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-results
          path: chaos-results.json
          if-no-files-found: ignore
